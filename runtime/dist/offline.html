<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B5D3B" />
    <link rel="icon" href="/brand/mih-dineos-mark.png" type="image/png" />
    <title>MIH DineOS · Offline</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; background: #FAFCF8; color: #1F2937; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 440px); text-align: center; background: #fff; border: 1px solid #E1E9E2; border-radius: 28px; padding: 42px 28px; box-shadow: 0 18px 50px rgba(11, 93, 59, .10); }
      .icon { width: 76px; height: 76px; display: block; object-fit: contain; margin: 0 auto 20px; }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0 auto 24px; line-height: 1.6; color: #5B6861; }
      button { border: 0; border-radius: 999px; padding: 13px 24px; background: #0B5D3B; color: #fff; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img class="icon" src="/brand/mih-dineos-mark.png" alt="MIH DineOS" />
      <h1>You’re offline</h1>
      <p>MIH DineOS is temporarily disconnected from the local network. Reconnect to Wi‑Fi and try again. Cached information on this device is still safe.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
