name: P44 Inventory foundation smoke
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/src/server/modules/inventory/**'
      - 'apps/api/src/server/modules/stock/**'
      - 'apps/api/src/server/routes/index.ts'
      - 'apps/api/src/server/db/migrations/017_inventory_foundation.ts'
      - 'tests/unit/inventory-foundation-smoke.cjs'
      - 'tests/unit/global-reports-runtime-smoke.cjs'
      - 'scripts/check-ts-syntax.cjs'
      - 'scripts/audit-phase-chain.cjs'
      - 'package.json'
      - '.github/workflows/p44-inventory-foundation-smoke.yml'
  pull_request:
    paths:
      - 'apps/api/src/server/modules/inventory/**'
      - 'apps/api/src/server/modules/stock/**'
      - 'apps/api/src/server/db/migrations/017_inventory_foundation.ts'
      - 'tests/unit/inventory-foundation-smoke.cjs'
      - 'tests/unit/global-reports-runtime-smoke.cjs'
      - 'scripts/check-ts-syntax.cjs'
      - 'scripts/audit-phase-chain.cjs'
      - 'package.json'
      - '.github/workflows/p44-inventory-foundation-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: restrox_test
          MYSQL_USER: rms
          MYSQL_PASSWORD: p43-ci-db-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure isolated MySQL migration environment
        run: |
          container_id="$(docker ps --filter 'ancestor=mysql:8.0' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec "$container_id" mysql -uroot -prootpassword -e "SET GLOBAL log_bin_trust_function_creators = 1"
      - name: Repeat P00–P44 static regression suite twice
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2; do
            echo "::group::Full available regression pass $pass"
            node scripts/audit-phase-chain.cjs
            node tests/unit/inventory-foundation-smoke.cjs
            npm run test:global-reports
            npm run test:finance-reports
            npm run check:ts-syntax
            echo "::endgroup::"
          done
      - name: Start production runtime against clean MySQL and apply migrations (pass 1)
        run: npm run test:global-reports:runtime
        env:
          P43_SMOKE_PORT: 4317
          P43_DB_HOST: 127.0.0.1
          P43_DB_PORT: 3306
          P43_DB_NAME: restrox_test
          P43_DB_USER: rms
          P43_DB_PASSWORD: p43-ci-db-password
      - name: Install isolated MySQL repository test dependencies
        run: npm install --no-save --package-lock=false tsx mysql2
      # Executes the repository itself against the migrated MySQL service, including forced mid-transfer rollback.
      # Keep the fixture test coupled to the same full migration path used by production startup.
      # The fixture also verifies branch-level isolation within a tenant.
      - name: Verify real inventory repository transactions, ledger and tenant isolation
        run: npm run test:inventory-foundation:mysql
        env:
          P44_DB_HOST: 127.0.0.1
          P44_DB_PORT: 3306
          P44_DB_NAME: restrox_test
          P44_DB_USER: rms
          P44_DB_PASSWORD: p43-ci-db-password
      - name: Start production runtime against migrated MySQL (pass 2)
        run: npm run test:global-reports:runtime
        env:
          P43_SMOKE_PORT: 4318
          P43_DB_HOST: 127.0.0.1
          P43_DB_PORT: 3306
          P43_DB_NAME: restrox_test
          P43_DB_USER: rms
          P43_DB_PASSWORD: p43-ci-db-password
