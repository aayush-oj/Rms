name: P43 Global Reports smoke
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/src/server/server.ts'
      - 'apps/web/public/reports.html'
      - 'apps/web/public/reports-catalog.json'
      - 'apps/web/public/en/reports/index.html'
      - 'runtime/dist/reports.html'
      - 'runtime/dist/reports-catalog.json'
      - 'runtime/dist/en/reports/index.html'
      - 'tests/unit/global-reports-smoke.cjs'
      - 'tests/unit/global-reports-runtime-smoke.cjs'
      - 'tests/unit/global-reports-browser-smoke.cjs'
      - 'scripts/audit-phase-chain.cjs'
      - 'docs/analysis/phase-00-to-43-audit.md'
      - 'package.json'
      - '.github/workflows/p43-global-reports-smoke.yml'
  pull_request:
    paths:
      - 'apps/api/src/server/server.ts'
      - 'apps/web/public/reports.html'
      - 'apps/web/public/reports-catalog.json'
      - 'apps/web/public/en/reports/index.html'
      - 'runtime/dist/reports.html'
      - 'runtime/dist/reports-catalog.json'
      - 'runtime/dist/en/reports/index.html'
      - 'tests/unit/global-reports-smoke.cjs'
      - 'package.json'
      - '.github/workflows/p43-global-reports-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: restrox_test
          MYSQL_USER: rms
          MYSQL_PASSWORD: p43-ci-db-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure isolated MySQL test instance for trigger migrations
        run: |
          container_id="$(docker ps --filter 'ancestor=mysql:8.0' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec "$container_id" mysql -uroot -prootpassword -e "SET GLOBAL log_bin_trust_function_creators = 1"
      - name: Audit phase chain and evidence manifest
        run: node scripts/audit-phase-chain.cjs
      - name: Verify P42 Finance Reports dependency contract
        run: npm run test:finance-reports
      - name: Verify global reports route and assets
        run: npm run test:global-reports
      - name: Verify TypeScript syntax
        run: npm run check:ts-syntax
      - name: Start runtime and verify route (pass 1)
        run: npm run test:global-reports:runtime
        env:
          P43_SMOKE_PORT: 4317
          P43_DB_HOST: 127.0.0.1
          P43_DB_PORT: 3306
          P43_DB_NAME: restrox_test
          P43_DB_USER: rms
          P43_DB_PASSWORD: p43-ci-db-password
      - name: Start runtime and verify route (pass 2)
        run: npm run test:global-reports:runtime
        env:
          P43_SMOKE_PORT: 4318
          P43_DB_HOST: 127.0.0.1
          P43_DB_PORT: 3306
          P43_DB_NAME: restrox_test
          P43_DB_USER: rms
          P43_DB_PASSWORD: p43-ci-db-password
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright axe-core
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify browser behavior and accessibility
        run: npm run test:global-reports:browser
        env:
          P43_BROWSER_PORT: 4319
          P43_DB_HOST: 127.0.0.1
          P43_DB_PORT: 3306
          P43_DB_NAME: restrox_test
          P43_DB_USER: rms
          P43_DB_PASSWORD: p43-ci-db-password
