<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance Reports | RestroX</title><style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f7f8fa;color:#1f2937}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.04)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.item{display:block;padding:14px;border:1px solid #e5e7eb;border-radius:10px;text-decoration:none;color:inherit}.muted{color:#6b7280;font-size:.9rem}</style></head><body><main class="wrap"><div class="card"><h1>Finance Reports</h1><p class="muted">Evidence-backed report catalog. Data remains tenant/branch scoped and bounded by server-side report contracts.</p><div id="reports" class="grid" aria-live="polite"></div></div></main><script>fetch('/finance-reports/catalog.json').then(r=>r.json()).then(items=>{document.getElementById('reports').innerHTML=items.map(x=>`<a class="item" href="${x.path}"><strong>${x.title}</strong><div class="muted">${x.id} · ${x.dataset}</div></a>`).join('')})</script></body></html>
